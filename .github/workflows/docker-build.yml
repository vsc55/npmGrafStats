name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]      # Only build on main branch
    tags: [ "v*" ]            # If the push is a tag like v1.2.3 → publish
  pull_request:

env:
  IMAGE_NAME: npmgraf

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- TESTS PYTHON ANTES DEL DOCKER ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        working-directory: root
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Run unit tests
        working-directory: root
        run: pytest -q

      # --- DOCKER BUILD / PUSH ---
      
      # Set up QEMU is needed is the compilation is not amd64
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only amd64 for validation if not a tag push
      - name: Build amd64 for validation
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test

      # Test the built image (only if not pushed)
      - name: Validate built image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: docker run --rm ${{ env.IMAGE_NAME }}:test --help

      # Login only for tag pushes
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build multi-arch + push only for tag pushes
      - name: Build and push multi-arch
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/386,linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: |
            ${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}